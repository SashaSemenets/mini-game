<div class="controls">
  <div class="input-group">
    <label for="interval" class="input-label">Reaction Time (ms)</label>
    <input
      id="interval"
      type="number"
      class="input-field"
      [value]="intervalMs()"
      (input)="onIntervalChange($any($event.target).value)"
      min="100"
      max="5000"
      step="50"
      placeholder="1000"
      [disabled]="isRunning()"
    />
  </div>

  <button
    type="button"
    class="btn"
    [disabled]="isRunning()"
    (click)="startGame()"
  >
    <span class="btn-icon">▶</span>
    <span class="btn-text">{{ isRunning() ? 'Playing...' : 'Start Game' }}</span>
  </button>
</div>
