<div class="layout">
  <header class="header">
    <h1 class="title">Test mini-game</h1>
    <div class="subtitle">beat the computer. click faster</div>
  </header>

  <div class="status" [class.status--active]="isRunning()">
    {{ statusMessage() }}
  </div>

  <app-scoreboard />
  <app-controls />
  <app-grid />
</div>

@if (winner()) {
  <div class="modal-backdrop" (click)="restartGame()">
    <div class="modal" (click)="$event.stopPropagation()">
      <div class="modal-icon">{{ playerWon() ? '🏆' : '🤖' }}</div>
      <h2 class="modal-title">{{ playerWon() ? 'You Win!' : 'CPU Wins!' }}</h2>
      <p class="modal-score">{{ playerScore() }} — {{ computerScore() }}</p>
      <button class="modal-btn" (click)="restartGame()">Play Again</button>
    </div>
  </div>
}
